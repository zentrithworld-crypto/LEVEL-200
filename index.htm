<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL//200</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 40px 20px;
        }
        .contenedor { max-width: 520px; margin: 0 auto; }

        .pantalla-carga {
            position: fixed; inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .pantalla-carga.ocultar { opacity: 0; visibility: hidden; }
        .logo {
            font-size: 4.5rem; font-weight: 900; letter-spacing: 6px; margin-bottom: 60px;
            background: linear-gradient(90deg, #00f5ff, #ff00f5, #ffd900);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: brillo 2s ease-in-out infinite alternate;
        }
        @keyframes brillo {
            from { filter: drop-shadow(0 0 20px rgba(0,245,255,0.4)); }
            to   { filter: drop-shadow(0 0 35px rgba(255,0,245,0.6)); }
        }
        .numero-estado { font-size: 3rem; font-weight: 700; color: #00f5ff; margin-bottom: 20px; }
        .contenedor-barra {
            width: 450px; height: 50px;
            background: rgba(255,255,255,0.08); border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.15); overflow: hidden;
            box-shadow: 0 0 25px rgba(0,245,255,0.15) inset; margin-bottom: 25px;
        }
        .barra-carga {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #00f5ff, #00c8ff, #ff00f5);
            border-radius: 50px; transition: width 0.3s ease;
            display: flex; align-items: center; justify-content: flex-end;
            padding-right: 20px; font-weight: bold; text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .texto-inferior { color: rgba(255,255,255,0.6); font-size: 1.1rem; letter-spacing: 2px; }

        .pantalla-ingreso {
            opacity: 0; transform: translateY(20px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        }
        .pantalla-ingreso.activa { opacity: 1; transform: translateY(0); }
        h1.titulo {
            text-align: center; font-size: 2.8rem;
            background: linear-gradient(90deg, #00f5ff, #ff00f5);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 10px;
        }
        .subtitulo { text-align: center; color: rgba(255,255,255,0.6); margin-bottom: 50px; font-size: 1.1rem; }

        .contenedor-botones { display: flex; flex-direction: column; gap: 20px; margin-bottom: 40px; }
        .boton-principal {
            padding: 22px 30px; font-size: 1.2rem; border: none; border-radius: 14px;
            cursor: pointer; font-weight: bold; transition: all 0.3s ease;
            text-align: left; display: flex; align-items: center; gap: 15px;
        }
        .boton-telefono { background: linear-gradient(90deg, #00f5ff, #00c8ff); color: #000; }
        .boton-invitado { background: linear-gradient(90deg, #ff00f5, #d000ff); color: white; }
        .boton-principal:hover { transform: scale(1.03); }
        .icono { font-size: 1.5rem; }

        .tarjeta-formulario {
            background: rgba(255,255,255,0.05); border-radius: 16px; padding: 30px;
            border: 1px solid rgba(255,255,255,0.1); display: none;
        }
        .tarjeta-formulario.activo { display: block; animation: aparecer 0.4s ease; }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .titulo-form { font-size: 1.3rem; color: #00f5ff; margin-bottom: 25px; text-align: center; }
        label { display: block; margin-bottom: 6px; color: #ddd; font-weight: 500; font-size: 0.95rem; }
        .campo {
            width: 100%; padding: 12px 15px; margin-bottom: 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15); border-radius: 8px;
            color: white; font-size: 1rem;
        }
        select.campo { cursor: pointer; }
        select.campo option { background: #1a1a2e; color: white; }
        .campo:focus { outline: none; border-color: #00f5ff; box-shadow: 0 0 10px rgba(0,245,255,0.2); }
        .edad-calculada {
            padding: 12px 15px; margin-bottom: 18px; border-radius: 8px;
            background: rgba(0,255,128,0.08); border: 1px solid rgba(0,255,128,0.2);
            color: #80ffb0; font-weight: 600; display: none;
        }
        .edad-calculada.visible { display: block; animation: aparecer 0.3s ease; }
        .grupo-radio { display: flex; gap: 20px; margin-bottom: 18px; }
        .opcion-radio {
            display: flex; align-items: center; gap: 8px; padding: 10px 18px;
            background: rgba(255,255,255,0.08); border-radius: 8px; cursor: pointer;
            border: 1px solid transparent; transition: all 0.2s;
        }
        .opcion-radio:hover, .opcion-radio.seleccionado {
            border-color: #00f5ff; background: rgba(0,245,255,0.1);
        }
        .boton-enviar {
            width: 100%; padding: 16px; font-size: 1.15rem;
            background: linear-gradient(90deg, #00f5ff, #ff00f5);
            border: none; border-radius: 12px; color: white; font-weight: bold;
            cursor: pointer; margin-top: 10px; transition: transform 0.3s;
        }
        .boton-enviar:hover { transform: scale(1.02); }
        .boton-volver {
            background: transparent; border: none; color: #888; margin-top: 15px;
            cursor: pointer; font-size: 0.95rem; width: 100%;
        }
        .boton-volver:hover { color: #fff; }
        .etiqueta { color: #ffd900; font-weight: bold; }
        .opcional { color: #888; font-weight: normal; }
    </style>
</head>
<body>

    <div class="pantalla-carga" id="pantallaCarga">
        <h1 class="logo">LEVEL//200</h1>
        <div class="numero-estado" id="numeroEstado">0 / 200</div>
        <div class="contenedor-barra">
            <div class="barra-carga" id="barraCarga">0%</div>
        </div>
        <p class="texto-inferior" id="textoInferior">Iniciando sistema...</p>
    </div>

    <div class="contenedor pantalla-ingreso" id="pantallaIngreso">
        <h1 class="titulo">🌟 LEVEL//200</h1>
        <p class="subtitulo">¿Cómo querés participar hoy?</p>

        <div class="contenedor-botones" id="seleccionIngreso">
            <button class="boton-principal boton-telefono" onclick="mostrarFormulario('telefono')">
                <span class="icono">📱</span>
                <div><strong>Cuenta con teléfono</strong><br><small>Participar con tu usuario y correo</small></div>
            </button>
            <button class="boton-principal boton-invitado" onclick="mostrarFormulario('invitado')">
                <span class="icono">👥</span>
                <div><strong>Cuenta invitado</strong><br><small>Participar solo con tu nombre de usuario</small></div>
            </button>
        </div>

        <div class="tarjeta-formulario" id="formularioTelefono">
            <h2 class="titulo-form">📱 Crear tu cuenta</h2>
            <form id="formTel">
                <label>Nombre de usuario <span class="etiqueta">*</span></label>
                <input type="text" class="campo" id="usuarioTel" placeholder="Como querés que te conozcan" required>

                <label>Correo electrónico <span class="etiqueta">*</span></label>
                <input type="email" class="campo" id="correoTel" placeholder="tu@ejemplo.com" required>

                <label>Fecha de nacimiento <span class="etiqueta">*</span></label>
                <input type="date" class="campo" id="fechaTel" min="2015-08-05" required onchange="calcularEdad(this.value, 'edadTel')">
                <div class="edad-calculada" id="edadTel"></div>

                <label>País <span class="etiqueta opcional">(opcional)</span></label>
                <select class="campo" id="paisTel">
                    <option value="">-- Elegí tu país --</option>
                    <option>Argentina</option><option>Bolivia</option><option>Brasil</option>
                    <option>Chile</option><option>Colombia</option><option>Ecuador</option>
                    <option>Paraguay</option><option>Perú</option><option>Uruguay</option>
                    <option>Venezuela</option><option>Estados Unidos</option><option>México</option>
                    <option>Guatemala</option><option>Honduras</option><option>El Salvador</option>
                    <option>Nicaragua</option><option>Costa Rica</option><option>Panamá</option>
                    <option>Cuba</option><option>República Dominicana</option><option>España</option>
                    <option>Otros / Prefiero no decirlo</option>
                </select>

                <label>¿Eres hombre o mujer? <span class="etiqueta">*</span></label>
                <div class="grupo-radio">
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="generoTel" value="hombre" required style="display:none;">♂️ Hombre
                    </label>
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="generoTel" value="mujer" style="display:none;">♀️ Mujer
                    </label>
                </div>

                <button type="submit" class="boton-enviar">CONTINUAR →</button>
                <button type="button" class="boton-volver" onclick="volver()">← Volver atrás</button>
            </form>
        </div>

        <div class="tarjeta-formulario" id="formularioInvitado">
            <h2 class="titulo-form">👥 Cuenta invitado</h2>
            <form id="formInvitado">
                <label>Nombre de usuario <span class="etiqueta">*</span></label>
                <input type="text" class="campo" id="usuarioInvitado" placeholder="Como querés que te conozcan" required>

                <label>Fecha de nacimiento <span class="etiqueta">*</span></label>
                <input type="date" class="campo" id="fechaInvitado" min="2015-08-05" required onchange="calcularEdad(this.value, 'edadInvitado')">
                <div class="edad-calculada" id="edadInvitado"></div>

                <label>País <span class="etiqueta opcional">(opcional)</span></label>
                <select class="campo" id="paisInvitado">
                    <option value="">-- Elegí tu país --</option>
                    <option>Argentina</option><option>Bolivia</option><option>Brasil</option>
                    <option>Chile</option><option>Colombia</option><option>Ecuador</option>
                    <option>Paraguay</option><option>Perú</option><option>Uruguay</option>
                    <option>Venezuela</option><option>Estados Unidos</option><option>México</option>
                    <option>Guatemala</option><option>Honduras</option><option>El Salvador</option>
                    <option>Nicaragua</option><option>Costa Rica</option><option>Panamá</option>
                    <option>Cuba</option><option>República Dominicana</option><option>España</option>
                    <option>Otros / Prefiero no decirlo</option>
                </select>

                <label>¿Eres hombre o mujer? <span class="etiqueta">*</span></label>
                <div class="grupo-radio">
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="generoInvitado" value="hombre" required style="display:none;">♂️ Hombre
                    </label>
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="generoInvitado" value="mujer" style="display:none;">♀️ Mujer
                    </label>
                </div>

                <button type="submit" class="boton-enviar">CONTINUAR →</button>
                <button type="button" class="boton-volver" onclick="volver()">← Volver atrás</button>
            </form>
        </div>
    </div>

    <script>
        // ==================================================
        // 📌 CONFIGURACIÓN DEL SERVIDOR 2 — CAMBIÁ ESTA DIRECCIÓN CUANDO LA TENGAS
        // ==================================================
        const SERVIDOR_DESTINO = "https://TU-SERVIDOR-2.com/api/registrar";

        // ==================================================
        // ANIMACIÓN DE CARGA
        // ==================================================
        let progreso = 0;
        const barra = document.getElementById("barraCarga");
        const numero = document.getElementById("numeroEstado");
        const texto = document.getElementById("textoInferior");
        const pantallaCarga = document.getElementById("pantallaCarga");
        const pantallaIngreso = document.getElementById("pantallaIngreso");

        const textosCarga = [
            "Iniciando sistema...", "Cargando perfiles...",
            "Conectando reglas de edad...", "Preparando países...", "¡Listo!"
        ];

        const intervalo = setInterval(() => {
            progreso++;
            barra.style.width = progreso + "%";
            barra.textContent = progreso + "%";
            numero.textContent = progreso + " / 200";
            const paso = Math.floor(progreso / 40);
            if (paso < textosCarga.length) texto.textContent = textosCarga[paso];
            if (progreso >= 200) {
                clearInterval(intervalo);
                setTimeout(() => { pantallaCarga.classList.add("ocultar"); pantallaIngreso.classList.add("activa"); }, 500);
            }
        }, 30);

        // ==================================================
        // MOSTRAR / OCULTAR FORMULARIOS
        // ==================================================
        function mostrarFormulario(tipo) {
            document.getElementById("seleccionIngreso").style.display = "none";
            if (tipo === "telefono") document.getElementById("formularioTelefono").classList.add("activo");
            else document.getElementById("formularioInvitado").classList.add("activo");
        }
        function volver() {
            document.querySelectorAll(".tarjeta-formulario").forEach(f => f.classList.remove("activo"));
            document.getElementById("seleccionIngreso").style.display = "flex";
        }

        // ==================================================
        // CALCULAR EDAD AUTOMÁTICA
        // ==================================================
        function calcularEdad(fechaNacStr, idDestino) {
            if (!fechaNacStr) { document.getElementById(idDestino).classList.remove("visible"); return; }
            const nac = new Date(fechaNacStr), hoy = new Date();
            let edad = hoy.getFullYear() - nac.getFullYear();
            const mes = hoy.getMonth() - nac.getMonth();
            if (mes < 0 || (mes === 0 && hoy.getDate() < nac.getDate())) edad--;
            const caja = document.getElementById(idDestino);
            caja.textContent = "🎂 Tenés " + edad + " años";
            caja.classList.add("visible");
        }

        // ==================================================
        // SELECCIONAR GÉNERO
        // ==================================================
        function seleccionarRadio(elemento) {
            elemento.parentElement.querySelectorAll(".opcion-radio").forEach(e => e.classList.remove("seleccionado"));
            elemento.classList.add("seleccionado");
            elemento.querySelector("input").checked = true;
        }

        // ==================================================
        // 📤 BLOQUE 1 — CUENTA CON TELÉFONO
        // ==================================================
        document.getElementById("formTel").addEventListener("submit", async e => {
            e.preventDefault();
            const datos = {
                tipo_registro: "cuenta_con_telefono",
                usuario: document.getElementById("usuarioTel").value.trim(),
                correo: document.getElementById("correoTel").value.trim(),
                fecha_nacimiento: document.getElementById("fechaTel").value,
                pais: document.getElementById("paisTel").value || "No especificado",
                genero: document.querySelector('input[name="generoTel"]:checked').value,
                fecha_envio: new Date().toISOString()
            };
            console.log("📤 Enviado:", datos);
            try {
                const res = await fetch(SERVIDOR_DESTINO, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });
                const json = await res.json();
                if (json.exito) { alert("✅ ¡Listo! Bienvenido, " + datos.usuario); e.target.reset(); volver(); }
                else alert("❌ " + (json.mensaje || "Error"));
            } catch { alert("🔌 Sin conexión con el servidor"); }
        });

        // ==================================================
        // 📤 BLOQUE 2 — CUENTA INVITADO
        // ==================================================
        document.getElementById("formInvitado").addEventListener("submit", async e => {
            e.preventDefault();
            const datos = {
                tipo_registro: "cuenta_invitado",
                usuario: document.getElementById("usuarioInvitado").value.trim(),
                fecha_nacimiento: document.getElementById("fechaInvitado").value,
                pais: document.getElementById("paisInvitado").value || "No especificado",
                genero: document.querySelector('input[name="generoInvitado"]:checked').value,
                fecha_envio: new Date().toISOString()
            };
            console.log("📤 Enviado:", datos);
            try {
                const res = await fetch(SERVIDOR_DESTINO, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });
                const json = await res.json();
                if (json.exito) { alert("✅ ¡Listo! Bienvenido, " + datos.usuario); e.target.reset(); volver(); }
                else alert("❌ " + (json.mensaje || "Error"));
            } catch { alert("🔌 Sin conexión con el servidor"); }
        });
    </script>
</body>
                    </html>
