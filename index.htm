<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEVEL//200</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 40px 20px;
        }
        .contenedor {
            max-width: 520px;
            margin: 0 auto;
        }

        /* ===== PANTALLA DE CARGA ===== */
        .pantalla-carga {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .pantalla-carga.ocultar {
            opacity: 0;
            visibility: hidden;
        }
        .logo {
            font-size: 4.5rem;
            font-weight: 900;
            letter-spacing: 6px;
            margin-bottom: 60px;
            background: linear-gradient(90deg, #00f5ff, #ff00f5, #ffd900);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: brillo 2s ease-in-out infinite alternate;
        }
        @keyframes brillo {
            from { filter: drop-shadow(0 0 20px rgba(0, 245, 255, 0.4)); }
            to   { filter: drop-shadow(0 0 35px rgba(255, 0, 245, 0.6)); }
        }
        .numero-estado {
            font-size: 3rem;
            font-weight: 700;
            color: #00f5ff;
            margin-bottom: 20px;
        }
        .contenedor-barra {
            width: 450px;
            height: 50px;
            background: rgba(255,255,255,0.08);
            border-radius: 50px;
            border: 2px solid rgba(255,255,255,0.15);
            overflow: hidden;
            box-shadow: 0 0 25px rgba(0,245,255,0.15) inset;
            margin-bottom: 25px;
        }
        .barra-carga {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00f5ff, #00c8ff, #ff00f5);
            border-radius: 50px;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 20px;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .texto-inferior {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        /* ===== PANTALLA DE INGRESO ===== */
        .pantalla-ingreso {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s ease 0.3s, transform 0.6s ease 0.3s;
        }
        .pantalla-ingreso.activa {
            opacity: 1;
            transform: translateY(0);
        }
        h1.titulo {
            text-align: center;
            font-size: 2.8rem;
            background: linear-gradient(90deg, #00f5ff, #ff00f5);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        .subtitulo {
            text-align: center;
            color: rgba(255,255,255,0.6);
            margin-bottom: 50px;
            font-size: 1.1rem;
        }

        /* ===== BOTONES PRINCIPALES ===== */
        .contenedor-botones {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }
        .boton-principal {
            padding: 22px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .boton-telefono {
            background: linear-gradient(90deg, #00f5ff, #00c8ff);
            color: #000;
        }
        .boton-invitado {
            background: linear-gradient(90deg, #ff00f5, #d000ff);
            color: white;
        }
        .boton-principal:hover {
            transform: scale(1.03);
        }
        .icono { font-size: 1.5rem; }

        /* ===== FORMULARIOS ===== */
        .tarjeta-formulario {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
        }
        .tarjeta-formulario.activo {
            display: block;
            animation: aparecer 0.4s ease;
        }
        @keyframes aparecer {
            from { opacity: 0; transform: translateY(15px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .titulo-form {
            font-size: 1.3rem;
            color: #00f5ff;
            margin-bottom: 25px;
            text-align: center;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #ddd;
            font-weight: 500;
            font-size: 0.95rem;
        }
        .campo {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 18px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        .campo:focus {
            outline: none;
            border-color: #00f5ff;
            box-shadow: 0 0 10px rgba(0,245,255,0.2);
        }
        .edad-calculada {
            padding: 12px 15px;
            margin-bottom: 18px;
            border-radius: 8px;
            background: rgba(0,255,128,0.08);
            border: 1px solid rgba(0,255,128,0.2);
            color: #80ffb0;
            font-weight: 600;
            display: none;
        }
        .edad-calculada.visible {
            display: block;
            animation: aparecer 0.3s ease;
        }
        .grupo-radio {
            display: flex;
            gap: 20px;
            margin-bottom: 18px;
        }
        .opcion-radio {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .opcion-radio:hover, .opcion-radio.seleccionado {
            border-color: #00f5ff;
            background: rgba(0,245,255,0.1);
        }
        .boton-enviar {
            width: 100%;
            padding: 16px;
            font-size: 1.15rem;
            background: linear-gradient(90deg, #00f5ff, #ff00f5);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.3s;
        }
        .boton-enviar:hover { transform: scale(1.02); }
        .boton-volver {
            background: transparent;
            border: none;
            color: #888;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.95rem;
            width: 100%;
        }
        .boton-volver:hover { color: #fff; }
        .etiqueta { color: #ffd900; font-weight: bold; }
        .opcional { color: #888; font-weight: normal; }
    </style>
</head>
<body>

    <!-- ===== PANTALLA DE CARGA ===== -->
    <div class="pantalla-carga" id="pantallaCarga">
        <h1 class="logo">LEVEL//200</h1>
        <div class="numero-estado" id="numero">0 / 200</div>
        <div class="contenedor-barra">
            <div class="barra-carga" id="barra">0%</div>
        </div>
        <p class="texto-inferior" id="mensaje">Iniciando sistema...</p>
    </div>

    <!-- ===== PANTALLA DE INGRESO ===== -->
    <div class="contenedor pantalla-ingreso" id="pantallaIngreso">
        <h1 class="titulo">🌟 LEVEL//200</h1>
        <p class="subtitulo">¿Cómo querés participar hoy?</p>

        <!-- Botones principales -->
        <div class="contenedor-botones" id="seleccionIngreso">
            <button class="boton-principal boton-telefono" onclick="mostrarFormulario('telefono')">
                <span class="icono">📱</span>
                <div>
                    <strong>Cuenta con teléfono</strong><br>
                    <small>Participar con tu usuario y correo</small>
                </div>
            </button>

            <button class="boton-principal boton-invitado" onclick="mostrarFormulario('invitado')">
                <span class="icono">👥</span>
                <div>
                    <strong>Cuenta invitado</strong><br>
                    <small>Participar solo con tu nombre de usuario</small>
                </div>
            </button>
        </div>

        <!-- ===== FORMULARIO: CUENTA CON TELÉFONO ===== -->
        <div class="tarjeta-formulario" id="formTelefono">
            <h2 class="titulo-form">📱 Crear tu cuenta</h2>
            <form action="formulario.html">
                <label>Nombre de usuario <span class="etiqueta">*</span></label>
                <input type="text" class="campo" placeholder="Como querés que te conozcan" required>

                <label>Correo electrónico <span class="etiqueta">*</span></label>
                <input type="email" class="campo" placeholder="tu@ejemplo.com" required>

                <label>Fecha de nacimiento <span class="etiqueta">*</span></label>
                <input type="date" class="campo" id="fechaTel" min="2015-08-05" required onchange="calcularEdad(this.value, 'edadTel')">
                <div class="edad-calculada" id="edadTel"></div>

                <label>País <span class="etiqueta opcional">(opcional)</span></label>
                <input type="text" class="campo" placeholder="Ej: Argentina, México, España...">

                <label>¿Eres hombre o mujer? <span class="etiqueta">*</span></label>
                <div class="grupo-radio">
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="genero" value="hombre" required style="display:none;">
                        ♂️ Hombre
                    </label>
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="genero" value="mujer" style="display:none;">
                        ♀️ Mujer
                    </label>
                </div>

                <button type="submit" class="boton-enviar">CONTINUAR →</button>
                <button type="button" class="boton-volver" onclick="volver()">← Volver atrás</button>
            </form>
        </div>

        <!-- ===== FORMULARIO: CUENTA INVITADO ===== -->
        <div class="tarjeta-formulario" id="formInvitado">
            <h2 class="titulo-form">👥 Cuenta invitado</h2>
            <form action="formulario.html">
                <label>Nombre de usuario <span class="etiqueta">*</span></label>
                <input type="text" class="campo" placeholder="Como querés que te conozcan" required>

                <label>Fecha de nacimiento <span class="etiqueta">*</span></label>
                <input type="date" class="campo" id="fechaInvitado" min="2015-08-05" required onchange="calcularEdad(this.value, 'edadInvitado')">
                <div class="edad-calculada" id="edadInvitado"></div>

                <label>País <span class="etiqueta opcional">(opcional)</span></label>
                <input type="text" class="campo" placeholder="Ej: Argentina, México, España...">

                <label>¿Eres hombre o mujer? <span class="etiqueta">*</span></label>
                <div class="grupo-radio">
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="genero_invitado" value="hombre" required style="display:none;">
                        ♂️ Hombre
                    </label>
                    <label class="opcion-radio" onclick="seleccionarRadio(this); return false;">
                        <input type="radio" name="genero_invitado" value="mujer" style="display:none;">
                        ♀️ Mujer
                    </label>
                </div>

                <button type="submit" class="boton-enviar">CONTINUAR →</button>
                <button type="button" class="boton-volver" onclick="volver()">← Volver atrás</button>
            </form>
        </div>
    </div>

    <script>
        // ===== ANIMACIÓN DE CARGA — LLEGA HASTA 200 =====
        const valorFinal = 200;
        const valorMaximo = 200;
        const duracionTotal = 6000;
        let valorActual = 0;

        const elementoNumero = document.getElementById('numero');
        const elementoBarra = document.getElementById('barra');
        const elementoMensaje = document.getElementById('mensaje');
        const pantallaCarga = document.getElementById('pantallaCarga');
        const pantallaIngreso = document.getElementById('pantallaIngreso');

        const mensajes = [
            { hasta: 0,   texto: 'Iniciando sistema...' },
            { hasta: 25,  texto: 'Preparando el desafío...' },
            { hasta: 75,  texto: 'Cargando el Bosque del Aprendizaje...' },
            { hasta: 120, texto: 'Conectando con las Tierras de Creación...' },
            { hasta: 180, texto: 'Subiendo hacia la Montaña de los Creadores...' },
            { hasta: 200, texto: '¡Llegando a la Cumbre Legendaria! 🏆' }
        ];

        function actualizarVista() {
            const porcentaje = (valorActual / valorMaximo) * 100;
            elementoNumero.textContent = valorActual + ' / ' + valorMaximo;
            elementoBarra.style.width = porcentaje + '%';
            elementoBarra.textContent = Math.round(porcentaje) + '%';
            for (let m of mensajes) {
                if (valorActual <= m.hasta) {
                    elementoMensaje.textContent = m.texto;
                    break;
                }
            }
        }

        function animar() {
            const pasos = valorFinal;
            const intervalo = duracionTotal / pasos;
            const temporizador = setInterval(() => {
                valorActual++;
                actualizarVista();
                if (valorActual >= valorFinal) {
                    clearInterval(temporizador);
                    setTimeout(() => {
                        pantallaCarga.classList.add('ocultar');
                        pantallaIngreso.classList.add('activa');
                    }, 800);
                }
            }, intervalo);
        }

        // ===== CÁLCULO AUTOMÁTICO DE EDAD =====
        function calcularEdad(fechaNacStr, elementoId) {
            if (!fechaNacStr) {
                document.getElementById(elementoId).classList.remove('visible');
                return;
            }
            const nacimiento = new Date(fechaNacStr);
            const hoy = new Date();
            
            let edad = hoy.getFullYear() - nacimiento.getFullYear();
            const mes = hoy.getMonth() - nacimiento.getMonth();
            if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) {
                edad--;
            }

            const cajaEdad = document.getElementById(elementoId);
            cajaEdad.textContent = `🎂 Tenés ${edad} años`;
            cajaEdad.classList.add('visible');
        }

        // ===== FUNCIONES DE LOS FORMULARIOS =====
        function mostrarFormulario(tipo) {
            document.getElementById('seleccionIngreso').style.display = 'none';
            if (tipo === 'telefono') {
                document.getElementById('formTelefono').classList.add('activo');
            } else {
                document.getElementById('formInvitado').classList.add('activo');
            }
        }

        function volver() {
            document.querySelectorAll('.tarjeta-formulario').forEach(f => f.classList.remove('activo'));
            document.querySelectorAll('.edad-calculada').forEach(e => e.classList.remove('visible'));
            document.getElementById('seleccionIngreso').style.display = 'flex';
        }

        function seleccionarRadio(elemento) {
            elemento.parentElement.querySelectorAll('.opcion-radio').forEach(opt => {
                opt.classList.remove('seleccionado');
                opt.querySelector('input').checked = false;
            });
            elemento.classList.add('seleccionado');
            elemento.querySelector('input').checked = true;
        }

        window.addEventListener('DOMContentLoaded', animar);
    </script>
</body>
</html>
